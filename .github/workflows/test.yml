name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          bash --version | head -1
          sqlite3 --version

      - name: Run test suite
        run: ./tests/run_tests.sh
